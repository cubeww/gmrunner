plugins {
    id 'com.android.application'
}

android {
    namespace = "dev.gmrunner"
    compileSdk = 35

    defaultConfig {
        applicationId "dev.gmrunner"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26",
                          "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../../third_party/SDL/android-project/app/src/main/java'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.24.0+'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
