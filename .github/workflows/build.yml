name: Build gmrunner (5 Platforms)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure & Build (Windows x64 Release)
        run: |
          cmake --preset windows-x64-release
          cmake --build --preset windows-x64-release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gmrunner-windows-x64
          path: build/windows-x64-release/bin/gmrunner.exe

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Configure & Build (Linux x64 Release)
        run: |
          cmake --preset linux-x64-release
          cmake --build --preset linux-x64-release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gmrunner-linux-x64
          path: build/linux-x64-release/bin/gmrunner

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure & Build (macOS .app Bundle)
        run: |
          cmake --preset macos-bundle-release
          cmake --build --preset macos-bundle-release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gmrunner-macos-app
          path: build/macos-bundle-release/bin/gmrunner.app

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure & Build (WebAssembly Asyncify)
        run: |
          cmake --preset wasm-release
          cmake --build --preset wasm-release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gmrunner-wasm
          path: |
            build/wasm-release/bin/gmrunner.html
            build/wasm-release/bin/gmrunner.js
            build/wasm-release/bin/gmrunner.wasm
            build/wasm-release/bin/gmrunner_web.js
            build/wasm-release/bin/gmrunner_web.css

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure & Build (Android arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cmake --preset android-arm64-release
          cmake --build --preset android-arm64-release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gmrunner-android-arm64
          path: |
            build/android-arm64-release/lib/libSDL3.so
            build/android-arm64-release/lib/libmain.so
